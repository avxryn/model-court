<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>Model Court</title>
    <!-- Applies the saved light or dark theme (D-47) before the first paint; same-origin, so the CSP allows it. -->
    <script src="/theme.js"></script>
    <!-- First-paint background for each theme, before the CSS bundle arrives. Mirrors --background in src/styles.css. -->
    <style>
      html { background-color: #e9e2d3; color-scheme: light; }
      html[data-theme="dark"] { background-color: #171512; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
