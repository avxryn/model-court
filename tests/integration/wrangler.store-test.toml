# Test-only Worker config: the production ModelCourtStore Durable Object.
name = "model-court-store-test"
main = "store-test-worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "ModelCourtStore"

[[durable_objects.bindings]]
name = "PRE_SAMPLES_STORE"
class_name = "PreSamplesStore"

[[durable_objects.bindings]]
name = "PRE_PROVIDERS_STORE"
class_name = "PreProvidersStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ModelCourtStore"]

# Test-only (D-65): a store held at the schema before 0009_generation_samples.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PreSamplesStore"]

# Test-only (D-106): a store held at the schema before 0015_provider_google.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["PreProvidersStore"]
